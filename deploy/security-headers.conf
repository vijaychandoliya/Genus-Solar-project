# Included per-location, not set once at server level, because nginx's
# add_header does not merge: a location with any add_header of its own DROPS
# every header inherited from the parent. The cache-control locations all have
# one, so setting these at the top would silently un-set them for /assets/ —
# the majority of every response.

add_header X-Content-Type-Options     "nosniff"                         always;
add_header X-Frame-Options            "DENY"                            always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin"                     always;

# Content-Security-Policy — ON, and exercised in a browser before being turned
# on rather than after. Each unobvious directive is here because something in
# this application needs it:
#
#   style-src 'unsafe-inline'   Emotion (MUI v9) injects component styles as
#                               inline <style> at runtime. Without it every
#                               screen renders unstyled.
#   fonts.googleapis.com        index.html loads Inter plus the customizer's
#   fonts.gstatic.com           alternate faces. Both sheets confirmed loading.
#   img-src data:               inlined SVG icons.
#   connect-src 'self'          the API is same-origin — see the note below.
#
# What testing it caught: index.html promoted the alternate font sheet with an
# inline onload="this.media='all'" attribute, which this policy blocks. It
# failed SILENTLY — the fonts simply never applied. The promotion now lives in
# src/main.jsx, and the shipped HTML carries no inline handler at all.
#
# Verified under this exact policy, on a production build: charts draw (canvas
# and the on-demand engine chunk), both font sheets load, Emotion's styles
# apply, the CSV export runs, the design-token editor works, and every lazy
# route chunk loads — console clean throughout.
#
# ── if your API is NOT same-origin ────────────────────────────────────────
# `connect-src 'self'` covers the recommended topology: serve this bundle and
# reverse-proxy /api behind the same hostname, which is also what the release
# zip is built for. If you instead point VITE_API_BASE_URL at another origin,
# add it here or every request fails as a CSP violation:
#
#   connect-src 'self' https://api.your-host;
#
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
