# Genus Solar — nginx for a single-page React bundle.
#
# Replaces /etc/nginx/nginx.conf wholesale rather than dropping a conf.d
# snippet, because two things have to change outside the server block: the pid
# and temp paths (so the container can run as a non-root uid) and logging to
# stdout/stderr.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Every path nginx writes to, under /tmp — the reason `USER nginx` works and
  # why `docker run --user 65532` also works.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # JSON lines, so the platform's log shipper does not need a grok pattern.
  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method"'
    ',"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent'
    ',"referer":"$http_referer","user_agent":"$http_user_agent"'
    ',"request_time":$request_time,"forwarded_for":"$http_x_forwarded_for"}';
  access_log /dev/stdout json_combined;

  sendfile        on;
  tcp_nopush      on;
  server_tokens   off;
  keepalive_timeout 65;

  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

  server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # Liveness/readiness. Cheap, unlogged, and it does not depend on the
    # backend — this container is healthy when it can serve files, which is a
    # different question from whether the API is up.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }


    # ── /assets/ is BOTH a build directory and an application route ────────
    # Vite writes the hashed bundles to /assets/, and the app also has screens
    # at /assets (Devices) and /assets/condition (Asset condition). So this
    # cannot be a plain `location /assets/` that 404s a miss — that serves the
    # build directory and breaks two screens on every refresh and shared link.
    #
    # The split is by filename shape instead: a hashed build file gets the
    # immutable cache, any other file-shaped request under /assets/ 404s, and
    # everything else falls through to the SPA fallback at the bottom.

    # index-BaZB5CBP.js — content-hashed, so a deploy changes the name and
    # there is never anything to invalidate.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|mjs|css|map|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|json)$" {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # A miss here means an incomplete deploy (the shell went up before its
    # assets). 404 is the honest answer; returning the HTML shell for a .js
    # request just turns it into a confusing MIME error in the console.
    location ~ "^/assets/.+\.(?:js|mjs|css|map|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|json)$" {
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # The shell. Must never be cached, or a browser keeps asking for the
    # previous deploy's asset filenames and gets 404s until someone hard-reloads.
    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Unhashed files served from public/ — the logos and favicon, at the root.
    # Short cache: their names are stable across deploys, so a long one pins a
    # stale logo for a year.
    location ~* "^/[^/]+\.(?:svg|png|ico|webp|woff2?)$" {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    # THE line that makes deep links work. The app uses BrowserRouter, so
    # /telemetry/gti/data and /admin/design-tokens are client-side routes with
    # no file behind them. Without this fallback every refresh and every shared
    # link is a 404 from nginx. Any other host (S3, CloudFront, Apache, an
    # ingress controller) needs its own equivalent — docs/DEPLOYMENT.md §4.
    #
    # Deliberately `$uri /index.html` and not `$uri $uri/ /index.html`: the
    # `$uri/` form matches the /assets/ DIRECTORY for a request to the /assets
    # route, and with no index file in it nginx answers 403 instead of the app.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, must-revalidate" always;
      try_files $uri /index.html;
    }
  }
}
