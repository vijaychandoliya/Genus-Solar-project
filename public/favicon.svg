  <!--
    The mark sits on its own white plate, matching the source logo. That keeps
    the brand blue and orange at their real values in every context — a favicon
    is fetched before any JS runs and is never re-fetched when the theme flips,
    so a plate that does not depend on the surface behind it is the only version
    that is correct in both schemes.
  -->
