# Gates every change, and builds the deployable image. It deliberately does not
# push or deploy: registry and environment credentials belong to whoever owns
# the cluster, and wiring them here would put a deploy path in a file that any
# branch can edit. Add a `release` job with your own secrets when you are ready
# — docs/DEPLOYMENT.md §6.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck · lint · test · docs · tokens · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # typecheck, lint, tests, the screen-inventory and help-panel checks, the
      # 2,250-pair contrast gate, and a build. Any one of them fails the job.
      - run: npm run verify

      # Separate from verify because it rebuilds with VITE_DATA_SOURCE=api and
      # greps the output: proof the fixture repositories are not in the bundle.
      - run: npm run verify:no-mocks

  image:
    name: build image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A placeholder URL is enough to prove the Dockerfile and its guards work.
      # The real per-environment build lives in your deploy pipeline, because the
      # API base URL is baked into the bundle and cannot be swapped afterwards.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: genus-solar:ci
          build-args: |
            VITE_API_BASE_URL=https://api.invalid/api
            VITE_DATA_SOURCE=api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the container and checks the two things a static host can get
      # wrong: the health endpoint, and the SPA fallback for a deep link.
      - name: smoke test
        run: |
          docker run -d --name genus-solar-ci -p 8080:8080 genus-solar:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz | grep -qx "ok"
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'

          # Client-side routes with no file behind them must return the shell.
          curl -fsS http://localhost:8080/telemetry/gti/data | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/admin/design-tokens | grep -q '<div id="root">'

          # The collision cases: /assets is both Vite's output directory and two
          # application routes. These two assertions are the regression test for
          # a /assets/ location that shadows them.
          curl -fsS http://localhost:8080/assets | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/assets/condition | grep -q '<div id="root">'

          # A hashed bundle: served, and cached immutably.
          ASSET=$(curl -fsS http://localhost:8080/ | grep -o 'assets/index-[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8080/$ASSET" | grep -qi "immutable"
          # A missing bundle must 404, not fall back to HTML.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/gone-Ab12Cd34.js)" = 404

          curl -fsSI http://localhost:8080/ | grep -qi "cache-control: no-store"
          curl -fsSI http://localhost:8080/ | grep -qi "x-content-type-options: nosniff"
          docker logs genus-solar-ci
          docker rm -f genus-solar-ci
